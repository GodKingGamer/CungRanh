<html lang="vi"><head><meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}
.ver{margin:28px 0 8px;text-align:center;color:var(--muted);font-size:12px;display:grid;gap:6px;justify-items:center}
.ver p{margin:0}
.linkbtn{font:inherit;font-size:13px;font-weight:600;color:var(--free);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px}
</style>
<title>Những người quá rảnh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
/* Layout: one narrow column of screens (home, invite, group). The group screen stacks a header, a summary row and three tabs: calendar, events, members. */
:root{
  --font-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#EDF2EE;--surface:#FFFFFF;--surface-2:#E3EAE5;--ink:#14221D;--muted:#586963;--line:#C9D5CE;
  --free:#0B7A63;--free-ink:#FFFFFF;--free-soft:#D6EEE6;
  --maybe:#B07508;--maybe-bg:#F7E8C6;--danger:#B3321F;
  --a0:#0B7A63;--a1:#4457B8;--a2:#8E3F7F;--a3:#B07508;--a4:#C23B55;--a5:#3E6B8A;--a6:#5E8C1F;--a7:#D2641A;--a8:#0E8FA8;--a9:#7A5230;--a-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;--surface:#16211D;--surface-2:#1D2B26;--ink:#E6EFEA;--muted:#93A59D;--line:#2B3B35;
    --free:#2FBF98;--free-ink:#06140F;--free-soft:#143A2F;--maybe:#E2B04A;--maybe-bg:#3A2F14;--danger:#F08A78;
    --a0:#2FBF98;--a1:#8B9CF0;--a2:#D08BC4;--a3:#E2B04A;--a4:#F28FA2;--a5:#7DB3D6;--a6:#A5D15A;--a7:#F2A05C;--a8:#55CDE6;--a9:#C9A27A;--a-ink:#0B1411;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613;--surface:#16211D;--surface-2:#1D2B26;--ink:#E6EFEA;--muted:#93A59D;--line:#2B3B35;
  --free:#2FBF98;--free-ink:#06140F;--free-soft:#143A2F;--maybe:#E2B04A;--maybe-bg:#3A2F14;--danger:#F08A78;
  --a0:#2FBF98;--a1:#8B9CF0;--a2:#D08BC4;--a3:#E2B04A;--a4:#F28FA2;--a5:#7DB3D6;--a6:#A5D15A;--a7:#F2A05C;--a8:#55CDE6;--a9:#C9A27A;--a-ink:#0B1411;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.app{max-width:860px;margin:0 auto;padding-block:14px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.05}
h2{font-weight:700;font-size:18px;letter-spacing:-.01em}
h3{font-weight:700;font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}

.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:40px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--free);border-color:var(--free);color:var(--free-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.back{align-self:flex-start;margin-bottom:-4px}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 4px;min-height:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.segb:focus-visible,.day:focus-visible,.tab:focus-visible,input:focus-visible,.gcard:focus-visible,.sw:focus-visible,.rs:focus-visible{outline:2px solid var(--free);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
.brand{font:800 22px/1 var(--font-display);letter-spacing:-.02em;color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer}
.brand i{font-style:normal;color:var(--free)}
.pill{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;font:600 11px/1.6 var(--font-body);letter-spacing:.04em;text-transform:uppercase;background:var(--maybe-bg);color:var(--ink);border:1px solid var(--maybe);vertical-align:middle}
.me{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;max-width:55vw}
.me span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{margin-bottom:14px;padding:12px 14px;border:1px solid var(--maybe);background:var(--maybe-bg);border-radius:10px}

.av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:99px;font:700 13px/1 var(--font-display);background:var(--a0);color:var(--a-ink);border:2px solid var(--surface)}
.av.l{width:36px;height:36px;font-size:16px}
.me .av{border:0}
.avs{display:inline-flex}
.avs .av{margin-left:-8px}
.avs .av:first-child{margin-left:0}
.avs .more{background:var(--surface-2);color:var(--ink)}
.tile{flex:none;display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;font:800 24px/1 var(--font-display);color:var(--a-ink);background:var(--a0)}
.tile.em{font-size:28px}.tile.em.l{font-size:32px}
.gemoji{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ge{font-size:22px;line-height:1;padding:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.ge[aria-pressed="true"]{border-color:var(--ink);background:var(--free-soft)}
.ge:focus-visible{outline:2px solid var(--free);outline-offset:2px}
.tile.ph{background-size:cover;background-position:center;font-size:0}
.tile.l{width:60px;height:60px;font-size:28px}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}.c4{background:var(--a4)}.c5{background:var(--a5)}.c6{background:var(--a6)}.c7{background:var(--a7)}.c8{background:var(--a8)}.c9{background:var(--a9)}
.av.em{font-size:15px;line-height:1}
.av.l.em{font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip .av{width:20px;height:20px;font-size:12px;border:0}
.dots{display:flex;flex-wrap:wrap;gap:1px;min-height:14px;margin-top:2px}
.pk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:99px;font-size:10px;line-height:1;transition:transform .15s,opacity .15s,box-shadow .15s}
.pk.mb{opacity:.5}
.pk-more{font-size:10px;font-weight:700;color:var(--muted);align-self:center}
.hlw.dim .pk:not(.lit){opacity:.18}
.hlw.dim .pchip:not(.lit){opacity:.55}
.pk.lit{animation-duration:.9s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pk.lit.d-bounce{animation-name:dBounce}.pk.lit.d-wiggle{animation-name:dWiggle}.pk.lit.d-spin{animation-name:dSpin;animation-timing-function:linear}.pk.lit.d-flip{animation-name:dFlip}.pk.lit.d-sway{animation-name:dSway}.pk.lit.d-shake{animation-name:dShake;animation-duration:.6s}.pk.lit.d-hop{animation-name:dHop}.pk.lit.d-pulse{animation-name:dPulse}
@keyframes dBounce{0%,100%{transform:translateY(0) scale(1.5)}50%{transform:translateY(-5px) scale(1.7)}}
@keyframes dWiggle{0%,100%{transform:rotate(-18deg) scale(1.5)}50%{transform:rotate(18deg) scale(1.5)}}
@keyframes dSpin{0%{transform:rotate(0deg) scale(1.5)}50%{transform:rotate(180deg) scale(1.5)}100%{transform:rotate(360deg) scale(1.5)}}
@keyframes dFlip{0%{transform:rotateY(0) scale(1.5)}50%{transform:rotateY(180deg) scale(1.7)}100%{transform:rotateY(360deg) scale(1.5)}}
@keyframes dSway{0%,100%{transform:translateX(-5px) rotate(-16deg) scale(1.5)}50%{transform:translateX(5px) rotate(16deg) scale(1.5)}}
@keyframes dShake{0%,100%{transform:translate(0,0) rotate(0) scale(1.6)}20%{transform:translate(-3px,1px) rotate(-14deg) scale(1.6)}40%{transform:translate(3px,-1px) rotate(14deg) scale(1.6)}60%{transform:translate(-3px,-1px) rotate(-10deg) scale(1.6)}80%{transform:translate(3px,1px) rotate(10deg) scale(1.6)}}
@keyframes dHop{0%,100%{transform:translate(0,0) scale(1.5,1.3)}30%{transform:translate(2px,-6px) scale(1.4,1.7)}60%{transform:translate(4px,0) scale(1.6,1.3)}}
@keyframes dPulse{0%,100%{transform:scale(1.2)}50%{transform:scale(2.1)}}
.av.dance.d-bounce{animation:dBounce .9s infinite}.av.dance.d-wiggle{animation:dWiggle .9s infinite}.av.dance.d-spin{animation:dSpin 1.2s linear infinite}.av.dance.d-flip{animation:dFlip 1.2s infinite}.av.dance.d-sway{animation:dSway 1.2s infinite}.av.dance.d-shake{animation:dShake .5s infinite}.av.dance.d-hop{animation:dHop 1s infinite}.av.dance.d-pulse{animation:dPulse 1s infinite}
.pchip.lit.d-bounce .av{animation-name:dBounce}.pchip.lit.d-wiggle .av{animation-name:dWiggle}.pchip.lit.d-spin .av{animation-name:dSpin;animation-timing-function:linear}.pchip.lit.d-flip .av{animation-name:dFlip}.pchip.lit.d-sway .av{animation-name:dSway}.pchip.lit.d-shake .av{animation-name:dShake}.pchip.lit.d-hop .av{animation-name:dHop}.pchip.lit.d-pulse .av{animation-name:dPulse}
.pchip.lit .av{animation-duration:.9s;animation-iteration-count:infinite}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.dances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dn{display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.dn[aria-pressed="true"]{border-color:var(--ink);background:var(--free-soft)}
.dn:focus-visible{outline:2px solid var(--free);outline-offset:2px}
.pk.lit{opacity:1;transform:scale(1.5);box-shadow:0 0 0 2px var(--surface),0 0 8px 2px var(--pc);position:relative;z-index:2}
.pchip.lit{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc),0 0 12px var(--pc)}
.day.hlc{outline:2px solid var(--pc);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){.pk,.pk.lit,.av.dance,.pchip.lit .av{animation:none!important;transition:none}}
.dot{width:8px;height:8px;border-radius:99px;box-shadow:0 0 0 1.5px var(--surface)}
.dot.mb{opacity:.45}
.pleg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;cursor:pointer;max-width:100%}
.pchip .av{width:24px;height:24px;font-size:13px;border:0}
.pchip .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip[aria-pressed="true"]{border-color:var(--ink);background:var(--free-soft)}
.pchip:focus-visible,.an:focus-visible{outline:2px solid var(--free);outline-offset:2px}
.swatches.wrap{flex-wrap:wrap}
.sw:disabled{opacity:.25;cursor:not-allowed}
.sec{margin:18px 0 8px}
.animals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.an{font-size:24px;line-height:1;padding:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.an[aria-pressed="true"]{border-color:var(--ink);background:var(--free-soft)}
.day.pf{background:var(--pc);border-color:var(--pc);color:var(--a-ink)}
.day.pf .mo{color:var(--a-ink)}
.day.pfm{background:var(--maybe-bg);border:2px dashed var(--pc)}

.hero{padding:18px 0 22px}
.hero p{margin-top:8px;color:var(--muted);max-width:52ch}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.gcard:hover{border-color:var(--muted)}
.gcard .nm{font:700 17px/1.2 var(--font-display);overflow-wrap:anywhere}
.gcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.gcard .st{font-size:13px;margin-top:6px;color:var(--ink)}
.empty{padding:28px 18px;text-align:center}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 16px}
.empty .row{justify-content:center}

.ghead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ghead .info{flex:1;min-width:180px}
.ghead h1{font-size:clamp(24px,5vw,32px)}
.ghead .sub{margin-top:4px;color:var(--muted)}
.ghead .avs{margin-top:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bar{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%}
.bar .f{background:var(--free)}
.bar .m{background:var(--maybe)}
.bestrow{display:flex;align-items:baseline;gap:12px;padding:6px 0}
.bestrow .d{font:800 20px/1 var(--font-display);min-width:62px;font-variant-numeric:tabular-nums}
.bestrow .w{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:64px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--free)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
.segb{font:inherit;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.status{font-size:12.5px;color:var(--muted)}
.hint{margin:12px 0 4px;color:var(--muted);min-height:3em}
.hint strong{color:var(--ink)}
.qd{margin:12px 0 8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.qd h3{margin-bottom:4px}
.qd .field{margin:12px 0}
.qd .rsvp{margin-top:6px}
.qd .row{margin-top:14px}
.warn{margin:10px 0 0;padding:8px 12px;border:1px solid var(--maybe);background:var(--maybe-bg);border-radius:10px;font-size:13px}
.sh-body .warn{margin:0 0 12px}
.msg2{margin-top:10px;min-height:1.4em;font-size:13px;color:var(--ink)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:4px}
.week.head{margin-top:10px}
.wdh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.month{font-size:16px;margin:16px 0 2px}
.day{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:58px;padding:6px 6px 5px;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.day.we{background:var(--surface-2)}
.day:disabled{opacity:.38;cursor:default}
.day .top{display:flex;align-items:baseline;gap:4px}
.day .n{font-weight:600;font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.day .mo{font-size:10px;font-weight:500;color:var(--muted)}
.day .tag{font-size:10.5px;font-weight:600;line-height:1;min-height:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day.heat{background:color-mix(in srgb,var(--free) calc(var(--r,0) * 88%),var(--surface))}
.day.heat.hot,.day.heat.hot .mo{color:var(--free-ink)}
.day.free{background:var(--free);border-color:var(--free);color:var(--free-ink)}
.day.free .mo{color:var(--free-ink)}
.day.maybe{background:var(--maybe-bg);border:1.5px dashed var(--maybe)}
.day.best{outline:2.5px solid var(--ink);outline-offset:1px}
.day:focus-visible{outline:2px solid var(--free);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.lg.f{background:var(--free);border-color:var(--free)}
.lg.m{background:var(--maybe-bg);border:1.5px dashed var(--maybe)}
.lg.b{background:var(--surface);outline:2px solid var(--ink)}

.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px}
.ev.past{opacity:.6}
.evd{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--free-soft);padding:8px 0;height:max-content}
.evd .w{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.evd .d{font:800 26px/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.evd .m{font-size:12px;color:var(--muted)}
.ev h3{font-size:17px;overflow-wrap:anywhere}
.ev .meta{margin-top:2px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.cd{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--free);color:var(--free-ink)}
.cd.off{background:var(--surface-2);color:var(--muted)}
.rsvp{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rs{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.rs[aria-pressed="true"]{background:var(--free-soft);border-color:var(--free)}
.who{margin-top:8px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-weight:600;overflow-wrap:anywhere}
.mrow .sub{font-size:13px;color:var(--muted)}
.tag2{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);vertical-align:middle}

/* Kho dữ liệu tạm trên một máy: dùng khi chưa cấu hình Firebase. Cùng giao diện với Firestore (doc/collection/onSnapshot/set/update/delete/get). */
function makeLocalDb(){
  var KEY="cungranh-local-db-v1",store={},subs=[];
  try{var raw=localStorage.getItem(KEY);if(raw)store=JSON.parse(raw)||{}}catch(e){store={}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
  function clone(v){return v==null?v:JSON.parse(JSON.stringify(v))}
  function parent(p){var i=p.lastIndexOf("/");return i<0?"":p.slice(0,i)}
  function lastSeg(p){return p.slice(p.lastIndexOf("/")+1)}
  function docSnap(p){var has=Object.prototype.hasOwnProperty.call(store,p);return {id:lastSeg(p),exists:has,data:function(){return has?clone(store[p]):undefined},metadata:{fromCache:false}}}
  function colSnap(p){var docs=Object.keys(store).filter(function(k){return parent(k)===p}).sort().map(function(k){return docSnap(k)});return {docs:docs,size:docs.length,metadata:{fromCache:false}}}
  function notify(){subs.slice().forEach(function(s){try{s.fire()}catch(e){}})}
  function later(fn){Promise.resolve().then(fn)}
  function doc(p){
    return {id:lastSeg(p),path:p,
      get:function(){return Promise.resolve(docSnap(p))},
      set:function(d){store[p]=clone(d);save();later(notify);return Promise.resolve()},
      update:function(d){if(!Object.prototype.hasOwnProperty.call(store,p))return Promise.reject(new Error("not-found"));store[p]=Object.assign({},store[p],clone(d));save();later(notify);return Promise.resolve()},
      delete:function(){delete store[p];save();later(notify);return Promise.resolve()},
      onSnapshot:function(next){var s={fire:function(){next(docSnap(p))}};subs.push(s);later(s.fire);return function(){subs=subs.filter(function(x){return x!==s})}}};
  }
  function collection(p){
    return {path:p,doc:function(id){return doc(p+"/"+id)},
      onSnapshot:function(next){var s={fire:function(){next(colSnap(p))}};subs.push(s);later(s.fire);return function(){subs=subs.filter(function(x){return x!==s})}}};
  }
  return {doc:doc,collection:collection};
}

/* ---------- dates ---------- */
var WD_FULL=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];

var now=new Date(),today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var start=addDays(today0,-((today0.getDay()+6)%7));
var DAYS=[];
for(var w=0;w<WEEKS*7;w++){var dd=addDays(start,w);DAYS.push({key:iso(dd),date:dd,we:(w%7)>=5,past:dd<today0})}

/* ---------- state ---------- */
var S={db:null,uid:null,readOnly:false,off:false,profile:null,slow:false,
  g:{},subs:new Map(),route:{view:"home"},tab:{},mode:{},weOnly:ls.get("cr:we")==="1",

}

var NCOL=10;

function toDate(d,m,y){

function parseDates(text){

    var s=null,e=null,m=/^(\d{1,2})(?:\/(\d{1,2}))?(?:\/(\d{2,4}))?[-–](\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(t);
    if(m){
      var y2=m[6]?+m[6]:0;

    }else{

  });
  return {keys:keys,bad:bad,badRaw:badRaw};
}

      if(!canWrite()){err.textContent="Bạn chưa có quyền chỉnh sửa.";return}
      await renameMe(n);api.close();
    }},field("mynick","Tên của bạn trong mọi nhóm",inp),h("button",{class:"btn primary",type:"submit",text:"Lưu"}),err));
  });
}
function trap(e){
  if(e.key==="Escape"){closeSheet();return}
  if(e.key!=="Tab")return;
  var f=Array.from($("#sheet").querySelectorAll("button,input,textarea")).filter(function(x){return !x.disabled&&x.offsetParent!==null});
  if(!f.length)return;
  var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
}

/* ---------- events & boot ---------- */
$("#brand").addEventListener("click",function(){navigate({view:"home"})});
$("#me").addEventListener("click",function(){
  var r=S.route,g=r.view==="group"?S.g[r.gid]:null;
  if(g&&g.members.has(S.uid)&&canWrite())sheetAvatar(r.gid);else sheetMe();
});
$("#ov-close").addEventListener("click",closeSheet);
$("#ov").addEventListener("click",function(e){if(e.target===$("#ov"))closeSheet()});
$("#ov").addEventListener("keydown",trap);
window.addEventListener("hashchange",function(){setRoute(parseHash())});

render();
$("#install").addEventListener("click",function(){sheetPlatform(null)});
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadFirebase(){
  var b="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
  await loadScript(b+"firebase-app-compat.min.js");
  await Promise.all([loadScript(b+"firebase-auth-compat.min.js"),loadScript(b+"firebase-firestore-compat.min.js")]);
}
(async function(){
  var cfg=window.CUNGRANH_FIREBASE;
  S.local=true;
  if(cfg&&cfg.apiKey){
    try{
      await loadFirebase();
      firebase.initializeApp(cfg);
      var auth=firebase.auth();
      await new Promise(function(res){var u=auth.onAuthStateChanged(function(){u();res()})});
      if(!auth.currentUser)await auth.signInAnonymously();
      S.db=firebase.firestore();S.uid=auth.currentUser.uid;S.local=false;
    }catch(e){S.db=null}
  }
  if(!S.db&&!(cfg&&cfg.apiKey)){S.db=makeLocalDb();S.uid=localUid()}
  if(!S.db||!S.uid){S.off=true;S.profile={name:"",groups:[]};render();return}
  var slow=setTimeout(function(){if(!S.profile){S.slow=true;schedule()}},10000);
  S.subs.set("profile",profileDoc().onSnapshot(function(s){
    var v=s.exists?s.data():{};
    S.profile={name:String(v.name||"").slice(0,20),groups:gids(v.groups)};
    clearTimeout(slow);reconcile();schedule();
  },function(){S.slow=true;schedule()}));
  var r=parseHash();S.route={view:"home"};setRoute(r);
})();
})();
</script>
<script>
if("serviceWorker" in navigator){
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(function(r){setInterval(function(){r.update().catch(function(){})},3600000)}).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!had){had=true;return}
    var t=document.getElementById("toast");t.hidden=false;
    document.getElementById("toast-reload").onclick=function(){location.reload()};
  });
}
</script>
